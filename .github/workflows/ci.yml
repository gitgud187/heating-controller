name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # daily, to notice a Home Assistant release that breaks us
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, imports, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov --cov-report=term-missing

  version:
    name: Manifest version matches tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          manifest=$(jq -r .version custom_components/heating_controller/manifest.json)
          test "v${manifest}" = "${GITHUB_REF_NAME}" || { echo "manifest ${manifest} != tag ${GITHUB_REF_NAME}"; exit 1; }
